version: '3'

services:
  llm-test-platform:
    build:
      context: .
      dockerfile: Dockerfile
    image: shz
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
      - ./output:/app/output
    environment:
      - FLASK_APP=backend/app.py
      - FLASK_ENV=production
      - OUTPUT_DIR=/app/output
    restart: unless-stopped
